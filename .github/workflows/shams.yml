name: Shams -> Telegram

on:
  schedule:
    # Каждые 20 минут. Для публичного репозитория Actions бесплатны;
    # для приватного это ~1500 минут/месяц (лимит 2000). Можно поставить */30.
    - cron: "*/20 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write # нужно, чтобы коммитить state.json обратно в репозиторий

concurrency:
  group: shams-telegram
  cancel-in-progress: false # не убивать запущенный процесс публикации

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run parser
        env:
          # Основной режим: бот от @BotFather (my.telegram.org не нужен)
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          # Опционально: публикация от имени личного аккаунта (Telethon)
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          # Источники и перевод можно менять без правки кода — через Variables репозитория
          RSSHUB_INSTANCES: ${{ vars.RSSHUB_INSTANCES }}
          CUSTOM_RSS_URL: ${{ vars.CUSTOM_RSS_URL }}
          TRANSLATOR: ${{ vars.TRANSLATOR || 'google_free' }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          MAX_POSTS_PER_RUN: ${{ vars.MAX_POSTS_PER_RUN || '5' }}
        run: python parser.py

      - name: Commit state
        if: always() # фиксируем state.json даже при частичном сбое
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ ! -f state.json ]; then
            echo "state.json ещё не создан: парсер не дошёл до сохранения (см. шаг 'Run parser')"
            exit 0
          fi
          git add state.json
          if git diff --cached --quiet; then
            echo "state.json не изменился"
          else
            git commit -m "state: update $(date -u +%FT%TZ)"
            git pull --rebase origin "${GITHUB_REF##*/}" || true
            git push
          fi
